{% comment %}
共通トップバー：種別切替プルダウン + 件数/地域/ユーザ選択フォーム
必要なコンテキスト:
  current_kind: 'artist' | 'lyricist' | 'composer' | 'year'
  ranking_options, top_n
  regions, region_id
  all_users, selected_user
{% endcomment %}
<div class="top-bar">
    <select id="kind-select" onchange="switchTopKind(this)">
        <option value="{% url 'ranking' %}" {% if current_kind == 'artist' %}selected{% endif %}>歌手</option>
        <option value="{% url 'lyricist_list' %}" {% if current_kind == 'lyricist' %}selected{% endif %}>作詞</option>
        <option value="{% url 'composer_list' %}" {% if current_kind == 'composer' %}selected{% endif %}>作曲</option>
        <option value="{% url 'year_list' %}" {% if current_kind == 'year' %}selected{% endif %}>年</option>
    </select>
    <form method="get">
        <select name="top_n" id="top_n" onchange="this.form.submit()">
            {% for n in ranking_options %}
                <option value="{{ n }}" {% if top_n == n %}selected{% endif %}>{{ n }}</option>
            {% endfor %}
        </select>
        <select name="region_id" id="region-select" onchange="this.form.submit()">
            <option value="" {% if not region_id %}selected{% endif %}>全て</option>
            {% for r in regions %}
                <option value="{{ r.id }}" {% if r.id|stringformat:"s" == region_id %}selected{% endif %}>{{ r.name }}</option>
            {% endfor %}
        </select>
        <select name="user" id="user" onchange="this.form.submit()">
            {% for user in all_users %}
                <option value="{{ user.id }}" {% if user == selected_user %}selected{% endif %}>
                    {{ user.username }}
                </option>
            {% endfor %}
        </select>
    </form>
</div>
<script>
    function switchTopKind(sel) {
        const params = new URLSearchParams(window.location.search);
        const qs = params.toString();
        window.location.href = sel.value + (qs ? "?" + qs : "");
    }
</script>
