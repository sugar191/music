{% extends 'base.html' %}
{% load get_item %}
{% load static %}
{% block title %}検索{% endblock %}
{% block content %}
    <!-- ユーザー選択プルダウン -->
    <div class="top-bar">
        <form method="get" action="{% url 'artist_search' %}">
            <input type="text" name="prefix" placeholder="検索" value="{{ prefix }}" style="flex: 1; width:150px;" onchange="this.form.submit()">
            <select name="region_id" id="region-select" onchange="this.form.submit()">
                <option value="" {% if not region_id %}selected{% endif %}>全て</option>
                {% for r in regions %}
                    <option value="{{ r.id }}" {% if r.id|stringformat:"s" == region_id %}selected{% endif %}>{{ r.name }}</option>
                {% endfor %}
            </select>
            <select id="top" name="top" onchange="this.form.submit()">
                <option value="">採点</option>
                <option value="0"  {% if request.GET.top == '0' %}selected{% endif %}>未採点あり</option>
                <option value="20~"  {% if request.GET.top == '20~' %}selected{% endif %}>未採点(20~)</option>
                <option value="5"  {% if request.GET.top == '5' %}selected{% endif %}>1~4曲</option>
                <option value="10" {% if request.GET.top == '10' %}selected{% endif %}>5~9曲</option>
                <option value="15" {% if request.GET.top == '15' %}selected{% endif %}>10~14曲</option>
                <option value="20" {% if request.GET.top == '20' %}selected{% endif %}>15~19曲</option>
            </select>
        </form>
    </div>
    <div class="table-area">
        <table>
            <tbody id="artist-rows">
                <tr>
                    <th>歌手名</th>
                    <th>採点</th>
                    <th>曲数</th>
                </tr>
                {% include "songs/partials/_artist_search_rows.html" %}
            </tbody>
        </table>
    </div>
    <div class="load-more-area">
        <button type="button" id="loadMoreBtn" class="load-more-btn"
                data-offset="{{ loaded_count }}"
                {% if not remaining_count %}hidden{% endif %}>
            もっと見る（残り <span id="remainingCount">{{ remaining_count }}</span> 件）
        </button>
        <div id="loadMoreStatus" class="load-more-status" hidden>読み込み中…</div>
    </div>
{% endblock %}

{% block extra_js %}
{{ block.super }}
<style>
    .load-more-area { text-align:center; margin:16px 0 32px; }
    .load-more-btn { padding:10px 24px; font-size:1rem; cursor:pointer; border:1px solid #999; border-radius:6px; background:#f5f5f5; }
    .load-more-btn:disabled { opacity:.5; cursor:default; }
    .load-more-status { margin-top:8px; color:#666; font-size:.9rem; }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const btn = document.getElementById("loadMoreBtn");
        const status = document.getElementById("loadMoreStatus");
        const tbody = document.getElementById("artist-rows");
        const remaining = document.getElementById("remainingCount");

        if (!btn) return;

        btn.addEventListener("click", function () {
            // 地域・採点・検索文字の絞り込みは現在のURLパラメータをそのまま引き継ぐ
            const params = new URLSearchParams(window.location.search);
            params.set("offset", btn.dataset.offset);

            btn.disabled = true;
            status.hidden = false;

            fetch("{% url 'artist_search_rows' %}?" + params.toString(), {
                headers: { "X-Requested-With": "XMLHttpRequest" },
            })
            .then(response => {
                if (!response.ok) throw new Error("HTTP " + response.status);
                return response.json();
            })
            .then(data => {
                tbody.insertAdjacentHTML("beforeend", data.html);
                btn.dataset.offset = data.loaded_count;
                remaining.textContent = data.remaining_count;
                if (data.remaining_count <= 0) btn.hidden = true;
            })
            .catch(error => {
                alert("読み込みに失敗しました");
                console.error(error);
            })
            .finally(() => {
                btn.disabled = false;
                status.hidden = true;
            });
        });
    });
</script>
{% endblock %}
